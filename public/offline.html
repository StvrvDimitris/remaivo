<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15372f" />
    <title>Remaivo is offline</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f4f1e9; color: #20332d; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(420px, 100%); padding: 32px; border-radius: 22px; background: #fffdf8; box-shadow: 0 20px 60px rgba(21,55,47,.12); }
      span { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 14px; background: #15372f; color: #dff35f; font-weight: 900; }
      h1 { margin: 24px 0 10px; font-size: 28px; letter-spacing: -.04em; }
      p { margin: 0; color: #66756f; line-height: 1.55; }
      button { margin-top: 24px; padding: 12px 18px; border: 0; border-radius: 12px; background: #15372f; color: white; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <span>R</span>
      <h1>Remaivo is offline.</h1>
      <p>Your financial data was not cached on this device. Reconnect securely to load the latest balances and budgets.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
