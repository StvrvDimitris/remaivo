services:
  remaivo:
    image: remaivo
    build: .
    pull_policy: build
    container_name: remaivo
    restart: unless-stopped
    ports:
      - "5007:5007"
    volumes:
      - ./remaivo-data:/data
    # environment:
    #   # Fix the password up front instead of choosing it on first visit.
    #   REMAIVO_PASSWORD: change-me-please
    #   # Set this when a reverse proxy rewrites the Host header (nginx does).
    #   APP_ORIGIN: https://money.example.com
